<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="google-site-verification" content="M46Z6EK5jIu97Pz4PKcqCxXcKvShrtd-8AOmrpYaS0Y" />
<title>Quick Revision - Maths Practice</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}
body{background:#f4f7fb;color:#111;overflow-x:hidden}

#splash-screen{
position:fixed;top:0;left:0;width:100%;height:100vh;background:white;
display:flex;justify-content:center;align-items:center;z-index:9999;
animation:fadeOut 1s ease forwards;animation-delay:3s
}
#splash-screen img{width:90%;max-width:420px;animation:zoomIn 2s ease}
@keyframes zoomIn{0%{transform:scale(.7);opacity:0}100%{transform:scale(1);opacity:1}}
@keyframes fadeOut{to{opacity:0;visibility:hidden}}

header{background:linear-gradient(135deg,#06163d,#0759d8);color:white;padding:25px;text-align:center}
header h1{font-size:42px}
header p{font-size:18px;margin-top:6px}

.container{max-width:1100px;margin:22px auto;padding:14px}
.card{background:white;border-radius:18px;padding:20px;box-shadow:0 8px 22px rgba(0,0,0,.08);margin-bottom:18px}

.section-title{
background:linear-gradient(135deg,#0036b8,#0759d8);color:white;padding:18px;
border-radius:14px 14px 0 0;font-size:26px;font-weight:bold;
display:flex;justify-content:space-between;align-items:center;cursor:pointer;margin-top:20px
}

.topic-box{
border:2px solid #0759d8;border-top:0;padding:14px;border-radius:0 0 14px 14px;
display:grid;grid-template-columns:repeat(2,1fr);gap:12px
}

.topic{
border:1.5px solid #b7c8ff;border-radius:10px;padding:12px;
display:flex;align-items:center;justify-content:space-between;gap:8px;
font-weight:bold;font-size:14px;background:white;cursor:pointer
}
.topic:hover{background:#eff6ff}

.badges{display:flex;gap:6px;white-space:nowrap}
.badge-blue{border:1px solid #8aa8ff;color:#0046d8;padding:5px 8px;border-radius:7px;font-size:12px}
.badge-green{border:1px solid #7ccf8a;color:#087a20;padding:5px 8px;border-radius:7px;font-size:12px}

.hidden{display:none}

.quiz-top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.timer{background:#fee2e2;color:#991b1b;padding:10px 14px;border-radius:12px;font-weight:bold}
.progress{font-weight:bold;color:#0759d8;margin:12px 0}

.question{font-size:22px;font-weight:bold;margin:18px 0}
.option{
display:block;width:100%;text-align:left;background:#f9fafb;color:#111;
border:2px solid #e5e7eb;margin:10px 0;padding:14px;border-radius:12px;cursor:pointer
}
.option.selected{border-color:#0759d8;background:#dbeafe}

.actions{display:flex;flex-direction:column;gap:12px;margin-top:18px}
.nav-buttons{display:flex;justify-content:space-between;width:100%;gap:10px}

button{
border:0;border-radius:12px;padding:12px 18px;font-weight:bold;cursor:pointer;
background:#0759d8;color:white
}
button:hover{background:#0036b8}
.submit-box{text-align:center}
.submit-btn{background:#16a34a}

.score{text-align:center;font-size:30px;color:#0759d8;font-weight:bold}
.review-item{border-left:5px solid #0759d8;padding:14px;margin:14px 0;background:#f8fafc;border-radius:10px}

footer{text-align:center;padding:18px;color:#555}

@media(max-width:700px){
header h1{font-size:30px}
.topic-box{grid-template-columns:1fr}
.topic{font-size:12px}
.question{font-size:18px}
.badge-blue,.badge-green{font-size:11px;padding:4px 6px}
}
</style>
</head>

<body>

<div id="splash-screen">
<img src="logo.png" alt="Logo">
</div>

<header>
<h1>Quick Revision</h1>
<p>Maths Practice Set for Competitive Exams</p>
</header>

<div class="container">

<section id="home" class="card">
<h2>Chapter Select करें</h2>
<p style="color:#555;margin-top:8px">किसी भी topic पर click करके quiz start करें।</p>

<div class="section-title" onclick="toggleBox('arithmeticBox')">
<span>▦ ARITHMETICS</span><span>⌄</span>
</div>
<div id="arithmeticBox" class="topic-box"></div>

<div class="section-title" onclick="toggleBox('advanceBox')">
<span>√x ADVANCE MATH</span><span>⌄</span>
</div>
<div id="advanceBox" class="topic-box"></div>
</section>

<section id="quiz" class="card hidden">
<div class="quiz-top">
<h2 id="quizTitle">Quiz</h2>
<div class="timer">Time: <span id="time">10:00</span></div>
</div>

<div class="progress">
Question <span id="qNo">1</span> / <span id="totalQ">0</span>
</div>

<div id="question" class="question"></div>
<div id="options"></div>

<div class="actions">
<div class="nav-buttons">
<button onclick="prevQuestion()">Previous</button>
<button onclick="nextQuestion()">Next</button>
</div>
<div class="submit-box">
<button class="submit-btn" onclick="submitQuiz()">Submit</button>
</div>
</div>
</section>

<section id="result" class="card hidden">
<h2 style="text-align:center">Result</h2>
<p id="scoreText" class="score"></p>
<p id="resultMsg" style="text-align:center;margin:10px 0"></p>
<div style="text-align:center;margin-top:15px">
<button onclick="goHome()">Home</button>
<button onclick="showReview()">Answer Review</button>
</div>
</section>

<section id="review" class="card hidden">
<h2>Answer Review</h2>
<div id="reviewBox"></div>
<div style="text-align:center">
<button onclick="goHome()">Back Home</button>
</div>
</section>

</div>

<footer>© Quick Revision | Maths Practice Site</footer>

<script>
const arithmeticTopics=[
"TEST YOUR CALCULATION","PERCENTAGE","PROFIT AND LOSS","DISCOUNT","PARTNERSHIP",
"RATIO AND PROPORTION","MIXTURE","ALLIGATION","SIMPLE INTEREST","COMPOUND INTEREST",
"AVERAGE","TIME AND WORK","PIPE AND CISTERN","TIME AND DISTANCE","TRAIN",
"BOAT AND STREAM","LINEAR AND CIRCULAR RACE","PERMUTATION AND COMBINATION",
"PROBABILITY","STATICS","LOGARITHM"
];

const advanceTopics=[
"NUMBER SYSTEM","LCM AND HCF","SEQUENCE AND SERIES","SIMPLIFICATION","SQUARE AND INDICES",
"GEOMETRY","MENSURATION 2D","MENSURATION 3D","ALGEBRA","TRIGONOMETRY",
"HEIGHT AND DISTANCE","CO-ORDINATE GEOMETRY"
];

const demoQuestions=[
{q:"50 का 20% कितना होगा?",a:["5","10","15","20"],c:1},
{q:"200 का 25% कितना होगा?",a:["25","50","75","100"],c:1},
{q:"100 रुपये की वस्तु 120 में बेची गई, लाभ कितना?",a:["10","15","20","25"],c:2},
{q:"2:4 का सरल रूप क्या है?",a:["1:2","2:3","4:8","3:4"],c:0},
{q:"1000 पर 10% दर से 1 वर्ष का साधारण ब्याज?",a:["50","100","150","200"],c:1}
];

let currentSet=[];
let currentIndex=0;
let answers=[];
let timer;
let timeLeft=600;

function makeTopics(list,boxId){
const box=document.getElementById(boxId);
box.innerHTML="";
list.forEach((topic,index)=>{
const div=document.createElement("div");
div.className="topic";
div.onclick=function(){startQuiz(topic)};
div.innerHTML=`
<span>${index+1}. ${topic}</span>
<div class="badges">
<span class="badge-blue">5 sets</span>
<span class="badge-green">50 Questions</span>
</div>`;
box.appendChild(div);
});
}

makeTopics(arithmeticTopics,"arithmeticBox");
makeTopics(advanceTopics,"advanceBox");

function toggleBox(id){
document.getElementById(id).classList.toggle("hidden");
}

function startQuiz(topic){
currentSet=demoQuestions;
currentIndex=0;
answers=new Array(currentSet.length).fill(null);

document.getElementById("home").classList.add("hidden");
document.getElementById("result").classList.add("hidden");
document.getElementById("review").classList.add("hidden");
document.getElementById("quiz").classList.remove("hidden");

document.getElementById("quizTitle").innerText=topic;
document.getElementById("totalQ").innerText=currentSet.length;

timeLeft=600;
startTimer();
loadQuestion();
}

function loadQuestion(){
const item=currentSet[currentIndex];
document.getElementById("qNo").innerText=currentIndex+1;
document.getElementById("question").innerText=item.q;

const box=document.getElementById("options");
box.innerHTML="";

item.a.forEach((opt,i)=>{
const btn=document.createElement("button");
btn.className="option";
btn.innerText=opt;
if(answers[currentIndex]===i){btn.classList.add("selected")}
btn.onclick=function(){answers[currentIndex]=i;loadQuestion()};
box.appendChild(btn);
});
}

function nextQuestion(){
if(currentIndex<currentSet.length-1){
currentIndex++;
loadQuestion();
}
}

function prevQuestion(){
if(currentIndex>0){
currentIndex--;
loadQuestion();
}
}

function startTimer(){
clearInterval(timer);
timer=setInterval(function(){
timeLeft--;
let min=Math.floor(timeLeft/60);
let sec=timeLeft%60;
document.getElementById("time").innerText=
String(min).padStart(2,"0")+":"+String(sec).padStart(2,"0");

if(timeLeft<=0){
clearInterval(timer);
submitQuiz();
}
},1000);
}

function submitQuiz(){
clearInterval(timer);
let score=0;
currentSet.forEach((q,i)=>{
if(answers[i]===q.c){score++}
});

document.getElementById("quiz").classList.add("hidden");
document.getElementById("result").classList.remove("hidden");

document.getElementById("scoreText").innerText=score+" / "+currentSet.length;
document.getElementById("resultMsg").innerText=
score>=currentSet.length/2 ? "बहुत अच्छा! आपकी तैयारी मजबूत है।" : "थोड़ा और revision करें।";
}

function showReview(){
document.getElementById("result").classList.add("hidden");
document.getElementById("review").classList.remove("hidden");

const reviewBox=document.getElementById("reviewBox");
reviewBox.innerHTML="";

currentSet.forEach((q,i)=>{
const div=document.createElement("div");
div.className="review-item";
div.innerHTML=`
<h3>Q${i+1}. ${q.q}</h3>
<p><b>Your Answer:</b> ${answers[i]!=null ? q.a[answers[i]] : "Not Answered"}</p>
<p><b>Correct Answer:</b> ${q.a[q.c]}</p>
`;
reviewBox.appendChild(div);
});
}

function goHome(){
clearInterval(timer);
document.getElementById("quiz").classList.add("hidden");
document.getElementById("result").classList.add("hidden");
document.getElementById("review").classList.add("hidden");
document.getElementById("home").classList.remove("hidden");
}
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quick Revision</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#f4f7fb;
color:#111;
}

.hidden{
display:none!important;
}

header{
background:#0b57d0;
color:white;
padding:18px;
text-align:center;
position:sticky;
top:0;
z-index:1000;
}

header h1{
font-size:38px;
}

header p{
font-size:15px;
margin-top:5px;
}

.container{
max-width:1150px;
margin:20px auto;
padding:15px;
}

.card{
background:white;
padding:22px;
border-radius:18px;
box-shadow:0 4px 12px rgba(0,0,0,.08);
margin-bottom:18px;
}

.grid2{
display:grid;
grid-template-columns:1fr 1fr;
gap:18px;
}

.big-btn{
padding:30px;
border-radius:18px;
border:2px solid #0b57d0;
background:white;
color:#0b57d0;
font-size:26px;
font-weight:bold;
cursor:pointer;
}

.topic{
border:2px solid #c7d2fe;
padding:14px;
border-radius:12px;
margin-bottom:12px;
display:flex;
justify-content:space-between;
align-items:center;
font-weight:bold;
cursor:pointer;
}

.badge{
border:1px solid #4ade80;
color:green;
padding:5px 8px;
border-radius:8px;
font-size:12px;
}

.question{
font-size:24px;
font-weight:bold;
margin:18px 0;
}

.option{
width:100%;
padding:14px;
margin:8px 0;
border:2px solid #ddd;
border-radius:12px;
background:white;
text-align:left;
cursor:pointer;
}

.option.selected{
background:#dbeafe;
border-color:#0b57d0;
}

.nav{
display:flex;
justify-content:space-between;
gap:10px;
margin-top:15px;
}

button{
border:0;
border-radius:12px;
padding:12px 18px;
background:#0b57d0;
color:white;
font-weight:bold;
cursor:pointer;
}

.green{
background:#16a34a;
}

.result-buttons{
display:flex;
justify-content:center;
gap:15px;
margin-top:18px;
}

.score{
text-align:center;
font-size:32px;
color:#0b57d0;
font-weight:bold;
}

.review-item{
border-left:5px solid #0b57d0;
background:#f8fafc;
padding:14px;
margin:14px 0;
border-radius:10px;
line-height:1.7;
}

footer{
text-align:center;
padding:22px;
color:#555;
line-height:1.8;
font-weight:bold;
}

</style>
</head>

<body>

<header>

<h1>Quick Revision</h1>

<p>
Railway | Bihar SI | Bihar Police | Bihar Teacher | SSC | Banking | BPSC
</p>

</header>

<div class="container">

<section id="testSelect" class="card">

<h2>Test Select करें</h2>

<br>

<div class="grid2">

<button class="big-btn" onclick="startMixTest()">
MIX TEST
</button>

<button class="big-btn" onclick="showChapterTest()">
CHAPTER TEST
</button>

</div>

</section>

<section id="chapterPage" class="card hidden">

<h2>Chapter Select करें</h2>

<br>

<div class="grid2">

<button class="big-btn" onclick="openCategory('arithmetic')">
ARITHMETICS
</button>

<button class="big-btn" onclick="openCategory('advance')">
ADVANCE MATH
</button>

</div>

<div id="categoryTopics" style="margin-top:20px;"></div>

<div class="nav">

<button onclick="prevTopicPage()">Previous</button>

<button onclick="nextTopicPage()">Next</button>

</div>

</section>

<section id="setPage" class="card hidden">

<h2 id="setTitle">Select Set</h2>

<br>

<div class="grid2">

<button class="big-btn" onclick="chooseSet(1)">SET 1</button>
<button class="big-btn" onclick="chooseSet(2)">SET 2</button>
<button class="big-btn" onclick="chooseSet(3)">SET 3</button>
<button class="big-btn" onclick="chooseSet(4)">SET 4</button>
<button class="big-btn" onclick="chooseSet(5)">SET 5</button>

</div>

</section>

<section id="languagePage" class="card hidden">

<h2>Language Choose करें</h2>

<br>

<div class="grid2">

<button class="big-btn" onclick="chooseLanguage('Hindi')">
Hindi
</button>

<button class="big-btn" onclick="chooseLanguage('English')">
English
</button>

</div>

<div style="text-align:center;margin-top:20px;">

<button class="green" onclick="startSelectedTest()">
START TEST
</button>

</div>

</section>

<section id="quiz" class="card hidden">

<h2 id="quizTitle">Quiz</h2>

<p>
Time:
<b id="time">00:30</b>
</p>

<p>
Question
<span id="qNo">1</span>
/
<span id="totalQ">0</span>
</p>

<div id="question" class="question"></div>

<div id="options"></div>

<div class="nav">

<button onclick="prevQuestion()">Previous</button>

<button onclick="nextQuestion()">Next</button>

</div>

<div style="text-align:center;margin-top:15px;">

<button class="green" onclick="submitQuiz()">
Submit
</button>

</div>

</section>

<section id="result" class="card hidden">

<h2 style="text-align:center;">Result</h2>

<p id="scoreText" class="score"></p>

<div class="result-buttons">

<button onclick="backHome()">Home</button>

<button onclick="showReview()">Analysis</button>

</div>

</section>

<section id="review" class="card hidden">

<h2>Analysis With Solution</h2>

<div id="reviewBox"></div>

</section>

</div>

<footer>

© Quick Revision | Maths Practice Site

<br>

Founder: Vicky Kumar

</footer>


<script>
const hindiPercentageQuestions=[
{
q:"चावल की कीमत 60% बढ़ गई। मूल कीमत पर वापस आने के लिए नई कीमत कितने प्रतिशत घटानी होगी?",
a:["33.33%","37.5%","40%","45%"],
c:1,
solution:"नई कीमत 160 होगी। कमी = 60/160 ×100 = 37.5%",
trick:"Reverse percentage"
}
];

const englishPercentageQuestions=[
{
q:"The price of rice increased by 60%. To restore original price, new price must be reduced by?",
a:["33.33%","37.5%","40%","45%"],
c:1,
solution:"Reduction = 60/160 ×100 = 37.5%",
trick:"Reverse percentage"
}
];
const arithmeticTopics=[
"TEST YOUR CALCULATION",
"PERCENTAGE",
"PROFIT AND LOSS",
"DISCOUNT",
"PARTNERSHIP",
"RATIO AND PROPORTION"
];

const advanceTopics=[
"NUMBER SYSTEM",
"LCM AND HCF",
"ALGEBRA",
"TRIGONOMETRY"
];

let activeCategory="";
let topicPage=0;
const topicsPerPage=7;

let currentTopic="";
let selectedSet=1;
let selectedLang="Hindi";
let currentSet=[];
let currentIndex=0;
let answers=[];
let timer;
let timeLeft=30;

function shuffleArray(arr){

let newArr=[...arr];

for(let i=newArr.length-1;i>0;i--){

let j=Math.floor(Math.random()*(i+1));

[newArr[i],newArr[j]]=[newArr[j],newArr[i]];

}

return newArr;
}

function hideAll(){

["testSelect","chapterPage","setPage","languagePage","quiz","result","review"].forEach(id=>{

document.getElementById(id).classList.add("hidden");

});

}

function showChapterTest(){

hideAll();

document.getElementById("chapterPage").classList.remove("hidden");

renderTopics();

}

function renderTopics(){

const box=document.getElementById("categoryTopics");

box.innerHTML="";

let list=activeCategory==="advance"
?advanceTopics
:arithmeticTopics;

list.forEach((topic,index)=>{

let div=document.createElement("div");

div.className="topic";

div.onclick=function(){

openSetPage(topic);

};

div.innerHTML=`<span>${index+1}. ${topic}</span>
<span class="badge">5 Sets</span>`;

box.appendChild(div);

});

}

function openCategory(type){

activeCategory=type;

renderTopics();

}

function openSetPage(topic){

currentTopic=topic;

hideAll();

document.getElementById("setPage").classList.remove("hidden");

document.getElementById("setTitle").innerText=topic;

}

function chooseSet(n){

selectedSet=n;

hideAll();

document.getElementById("languagePage").classList.remove("hidden");

}

function chooseLanguage(lang){

selectedLang=lang;

}

function startMixTest(){

currentTopic="MIX TEST";

selectedSet=1;

hideAll();

document.getElementById("languagePage").classList.remove("hidden");

}

function startSelectedTest(){

currentSet = selectedLang==="English"
? shuffleArray(englishPercentageQuestions).slice(0,30)
: shuffleArray(hindiPercentageQuestions).slice(0,30);

currentIndex=0;

answers=new Array(currentSet.length).fill(null);

hideAll();

document.getElementById("quiz").classList.remove("hidden");

document.getElementById("totalQ").innerText=currentSet.length;

startTimer();

loadQuestion();

}

function loadQuestion(){

const q=currentSet[currentIndex];

document.getElementById("qNo").innerText=currentIndex+1;

document.getElementById("question").innerText=q.q;

const box=document.getElementById("options");

box.innerHTML="";

q.a.forEach((opt,i)=>{

const btn=document.createElement("button");

btn.className="option";

btn.innerText=opt;

if(answers[currentIndex]===i){

btn.classList.add("selected");

}

btn.onclick=function(){

answers[currentIndex]=i;

loadQuestion();

};

box.appendChild(btn);

});

timeLeft=30;

document.getElementById("time").innerText="00:30";

}

function nextQuestion(){

if(currentIndex<currentSet.length-1){

currentIndex++;

loadQuestion();

}else{

submitQuiz();

}

}

function prevQuestion(){

if(currentIndex>0){

currentIndex--;

loadQuestion();

}

}

function startTimer(){

clearInterval(timer);

timer=setInterval(()=>{

timeLeft--;

document.getElementById("time").innerText="00:"+String(timeLeft).padStart(2,"0");

if(timeLeft<=0){

nextQuestion();

}

},1000);

}

function submitQuiz(){

clearInterval(timer);

let score=0;

currentSet.forEach((q,i)=>{

if(answers[i]===q.c){

score++;

}

});

hideAll();

document.getElementById("result").classList.remove("hidden");

document.getElementById("scoreText").innerText=score+" / "+currentSet.length;

}

function showReview(){

hideAll();

document.getElementById("review").classList.remove("hidden");

const box=document.getElementById("reviewBox");

box.innerHTML="";

currentSet.forEach((q,i)=>{

box.innerHTML+=`

<div class="review-item">

<b>Q${i+1}. ${q.q}</b><br>

Your Answer:
${answers[i]!=null?q.a[answers[i]]:"Not Answered"}

<br>

Correct Answer:
${q.a[q.c]}

<br>

Solution:
${q.solution}

<br>

Trick:
${q.trick}

</div>

`;

});

}

function backHome(){

location.reload();

}

</script>

</body>
</html>

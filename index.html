<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<meta name="google-site-verification" content="M46Z6EK5jIu97Pz4PKcqCxXcKvShrtd-8AOmrpYaS0Y" />
<title>Quick Revision - Maths Practice</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#f4f7fb;
color:#111;
}

/* Splash Screen */

#splash{
height:100vh;
width:100%;
display:flex;
align-items:center;
justify-content:center;
background:white;
}

#splash img{
width:90%;
max-width:420px;
}

.hidden{
display:none;
}

/* Header */

header{
background:linear-gradient(135deg,#111827,#2563eb);
color:white;
padding:22px;
text-align:center;
}

header h1{
font-size:42px;
margin-bottom:8px;
}

header p{
font-size:18px;
opacity:.9;
}

/* Container */

.container{
max-width:950px;
margin:22px auto;
padding:14px;
}

/* Cards */

.card{
background:white;
border-radius:18px;
padding:20px;
margin-bottom:18px;
box-shadow:0 8px 22px rgba(0,0,0,.08);
}

/* Chapters */

.chapters{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
gap:14px;
margin-top:18px;
}

.chapter{
border:2px solid #e5e7eb;
border-radius:16px;
padding:18px;
cursor:pointer;
text-align:center;
font-weight:bold;
background:white;
transition:.3s;
}

.chapter:hover{
border-color:#2563eb;
background:#eff6ff;
}

/* Buttons */

button{
border:0;
border-radius:12px;
padding:12px 18px;
font-weight:bold;
cursor:pointer;
background:#2563eb;
color:white;
margin-top:10px;
}

button:hover{
background:#1d4ed8;
}

/* Quiz */

.topbar{
display:flex;
justify-content:space-between;
align-items:center;
gap:10px;
flex-wrap:wrap;
}

.timer{
background:#fee2e2;
color:#991b1b;
padding:10px 14px;
border-radius:12px;
font-weight:bold;
}

.question{
font-size:22px;
font-weight:bold;
margin:18px 0;
}

.option{
display:block;
width:100%;
text-align:left;
background:#f9fafb;
color:#111;
border:2px solid #e5e7eb;
margin:10px 0;
padding:14px;
border-radius:12px;
cursor:pointer;
}

.option.selected{
border-color:#2563eb;
background:#dbeafe;
}

.option.correct{
border-color:#16a34a;
background:#dcfce7;
}

.option.wrong{
border-color:#dc2626;
background:#fee2e2;
}

.actions{
display:flex;
flex-direction:column;
gap:12px;
margin-top:18px;
}

/* Result */

.score{
font-size:28px;
font-weight:bold;
color:#2563eb;
text-align:center;
}

.review-item{
border-left:5px solid #2563eb;
padding:14px;
margin:14px 0;
background:#f8fafc;
border-radius:10px;
}

.small{
font-size:14px;
color:#555;
margin-top:8px;
line-height:1.5;
}

footer{
text-align:center;
padding:18px;
color:#555;
}

/* Mobile */

@media(max-width:600px){

header h1{
font-size:30px;
}

.question{
font-size:18px;
}

}

</style>
</head>

<body>

<!-- Splash Screen -->

<div id="splash">
<img src="logo.png" alt="Quick Revision Logo">
</div>

<!-- Main Site -->

<div id="mainSite" class="hidden">

<header>
<h1>Quick Revision</h1>
<p>Maths Practice Set for Competitive Exams</p>
</header>

<div class="container">

<!-- Home -->

<section id="home" class="card">

<h2>Chapter Select करें</h2>

<p class="small">
किसी भी chapter पर click करके practice start करें।
</p>

<div class="chapters">

<div class="chapter" onclick="startQuiz('percentage')">
Percentage
</div>

<div class="chapter" onclick="startQuiz('profit')">
Profit & Loss
</div>

<div class="chapter" onclick="startQuiz('ratio')">
Ratio
</div>

<div class="chapter" onclick="startQuiz('simple')">
Simple Interest
</div>

</div>
</section>

<!-- Quiz -->

<section id="quiz" class="card hidden">

<div class="topbar">

<h2 id="chapterTitle">Practice Set</h2>

<div class="timer">
Time:
<span id="time">10:00</span>
</div>

</div>

<div class="small">
Question
<span id="qNo">1</span>
/
<span id="totalQ">0</span>
</div>

<div id="question" class="question"></div>

<div id="options"></div>

<div class="actions">

<div style="display:flex;justify-content:space-between;width:100%;gap:10px;">

<button onclick="prevQuestion()">
Previous
</button>

<button onclick="nextQuestion()">
Next
</button>

</div>

<div style="width:100%;text-align:center;">

<button onclick="submitQuiz()">
Submit
</button>

</div>

</div>

</section>

<!-- Result -->

<section id="result" class="card hidden">

<h2 style="text-align:center;">Result</h2>

<p class="score" id="scoreText"></p>

<p id="resultMsg"
style="text-align:center;margin:10px 0;">
</p>

<div class="actions"
style="justify-content:center;">

<button onclick="goHome()">Home</button>

<button onclick="showReview()">
Answer Review
</button>

</div>

</section>

<!-- Review -->

<section id="review" class="card hidden">

<h2>Answer Review</h2>

<div id="reviewBox"></div>

<div style="text-align:center;">
<button onclick="goHome()">Back Home</button>
</div>

</section>

</div>

<footer>
© Quick Revision | Maths Practice Site
</footer>

</div>

<script>

/* Splash */

setTimeout(function(){

document.getElementById("splash").style.display="none";

document.getElementById("mainSite").classList.remove("hidden");

},5000);

/* Questions */

const questionSet={

percentage:[

{
q:"50 का 20% कितना होगा?",
a:["5","10","15","20"],
c:1
},

{
q:"200 का 25% कितना होगा?",
a:["25","50","75","100"],
c:1
}

],

profit:[

{
q:"100 रुपये की वस्तु 120 में बेची गई, लाभ कितना?",
a:["10","15","20","25"],
c:2
},

{
q:"500 की वस्तु 450 में बेची गई, हानि कितनी?",
a:["10%","20%","5%","15%"],
c:0
}

],

ratio:[

{
q:"2:4 का सरल रूप क्या है?",
a:["1:2","2:3","4:8","3:4"],
c:0
},

{
q:"5:10 = ?",
a:["2:5","1:2","3:4","5:6"],
c:1
}

],

simple:[

{
q:"1000 पर 10% वार्षिक दर से 1 वर्ष का साधारण ब्याज?",
a:["50","100","150","200"],
c:1
},

{
q:"2000 पर 5% दर से 2 वर्ष का ब्याज?",
a:["100","150","200","250"],
c:2
}

]

};

let currentSet=[];
let currentIndex=0;
let answers=[];
let timer;
let timeLeft=600;

/* Start Quiz */

function startQuiz(chapter){

currentSet=questionSet[chapter];

currentIndex=0;

answers=new Array(currentSet.length).fill(null);

document.getElementById("home").classList.add("hidden");

document.getElementById("quiz").classList.remove("hidden");

document.getElementById("chapterTitle").innerText=chapter.toUpperCase();

document.getElementById("totalQ").innerText=currentSet.length;

timeLeft=600;

startTimer();

loadQuestion();

}

/* Load Question */

function loadQuestion(){

const item=currentSet[currentIndex];

document.getElementById("qNo").innerText=currentIndex+1;

document.getElementById("question").innerText=item.q;

const box=document.getElementById("options");

box.innerHTML="";

item.a.forEach((opt,i)=>{

const btn=document.createElement("button");

btn.className="option";

btn.innerText=opt;

if(answers[currentIndex]===i){

btn.classList.add("selected");

}

btn.onclick=()=>selectOption(i);

box.appendChild(btn);

});

}

/* Select */

function selectOption(i){

answers[currentIndex]=i;

loadQuestion();

}

/* Next */

function nextQuestion(){

if(currentIndex<currentSet.length-1){

currentIndex++;

loadQuestion();

}

}

/* Previous */

function prevQuestion(){

if(currentIndex>0){

currentIndex--;

loadQuestion();

}

}

/* Timer */

function startTimer(){

clearInterval(timer);

timer=setInterval(()=>{

timeLeft--;

let min=Math.floor(timeLeft/60);

let sec=timeLeft%60;

document.getElementById("time").innerText=
`${String(min).padStart(2,'0')}:${String(sec).padStart(2,'0')}`;

if(timeLeft<=0){

clearInterval(timer);

submitQuiz();

}

},1000);

}

/* Submit */

function submitQuiz(){

clearInterval(timer);

let score=0;

currentSet.forEach((q,i)=>{

if(answers[i]===q.c){

score++;

}

});

document.getElementById("quiz").classList.add("hidden");

document.getElementById("result").classList.remove("hidden");

document.getElementById("scoreText").innerText=
`${score} / ${currentSet.length}`;

document.getElementById("resultMsg").innerText=
score>=currentSet.length/2
?
"बहुत अच्छा! आपकी तैयारी मजबूत है।"
:
"थोड़ा और revision करें।";

}

/* Review */

function showReview(){

document.getElementById("result").classList.add("hidden");

document.getElementById("review").classList.remove("hidden");

const reviewBox=document.getElementById("reviewBox");

reviewBox.innerHTML="";

currentSet.forEach((q,i)=>{

const div=document.createElement("div");

div.className="review-item";

div.innerHTML=`

<h3>Q${i+1}. ${q.q}</h3>

<p>
<b>Your Answer:</b>
${answers[i]!=null ? q.a[answers[i]] : "Not Answered"}
</p>

<p>
<b>Correct Answer:</b>
${q.a[q.c]}
</p>

`;

reviewBox.appendChild(div);

});

}

/* Home */

function goHome(){

document.getElementById("quiz").classList.add("hidden");

document.getElementById("result").classList.add("hidden");

document.getElementById("review").classList.add("hidden");

document.getElementById("home").classList.remove("hidden");

}

</script>

</body>
</html>

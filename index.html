<!DOCTYPE html>
<html lang="hi">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<meta name="google-site-verification"
content="M46Z6EK5jIu97Pz4PKcqCxXcKvShrtd-8AOmrpYaS0Y" />

<title>Quick Revision - Maths Practice</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#f4f7fb;
color:#111;
overflow-x:hidden;
}

/* Header */

header{
background:linear-gradient(135deg,#06163d,#0759d8);
color:white;
padding:25px;
text-align:center;
}

header h1{
font-size:42px;
}

header p{
font-size:18px;
margin-top:6px;
}

/* Main */

.container{
max-width:1100px;
margin:22px auto;
padding:14px;
}

.card{
background:white;
border-radius:18px;
padding:20px;
box-shadow:0 8px 22px rgba(0,0,0,.08);
}

/* Section */

.section-title{
background:linear-gradient(135deg,#0036b8,#0759d8);
color:white;
padding:18px;
border-radius:14px 14px 0 0;
font-size:26px;
font-weight:bold;
display:flex;
justify-content:space-between;
align-items:center;
cursor:pointer;
margin-top:20px;
}

/* Topic Box */

.topic-box{
border:2px solid #0759d8;
border-top:0;
padding:14px;
border-radius:0 0 14px 14px;
display:grid;
grid-template-columns:repeat(2,1fr);
gap:12px;
}

/* Topic */

.topic{
border:1.5px solid #b7c8ff;
border-radius:10px;
padding:12px;
display:flex;
align-items:center;
justify-content:space-between;
gap:8px;
font-weight:bold;
font-size:14px;
background:white;
}

.left{
display:flex;
align-items:center;
gap:10px;
}

.check{
width:20px;
height:20px;
cursor:pointer;
}

/* Badges */

.badges{
display:flex;
gap:6px;
white-space:nowrap;
}

.badge-blue{
border:1px solid #8aa8ff;
color:#0046d8;
padding:5px 8px;
border-radius:7px;
font-size:12px;
}

.badge-green{
border:1px solid #7ccf8a;
color:#087a20;
padding:5px 8px;
border-radius:7px;
font-size:12px;
}

/* Bottom */

.bottom-bar{
margin-top:18px;
border:1px solid #8aa8ff;
border-radius:10px;
display:flex;
overflow:hidden;
}

.selected-count{
width:50%;
text-align:center;
padding:14px;
font-weight:bold;
color:#0046d8;
}

.start-btn{
width:50%;
border:0;
background:#16a34a;
color:white;
font-weight:bold;
font-size:16px;
cursor:pointer;
}

/* Footer */

footer{
text-align:center;
padding:18px;
color:#555;
}

/* Mobile */

@media(max-width:700px){

header h1{
font-size:30px;
}

.topic-box{
grid-template-columns:1fr;
}

.topic{
font-size:12px;
}

.badge-blue,
.badge-green{
font-size:11px;
padding:4px 6px;
}

}
#splash-screen{
position:fixed;
top:0;
left:0;
width:100%;
height:100vh;
background:white;
display:flex;
justify-content:center;
align-items:center;
z-index:9999;
animation:fadeOut 1s ease forwards;
animation-delay:3s;
}

#splash-screen img{
width:220px;
animation:zoomIn 2s ease;
}

@keyframes zoomIn{
0%{
transform:scale(0.5);
opacity:0;
}
100%{
transform:scale(1);
opacity:1;
}
}

@keyframes fadeOut{
to{
opacity:0;
visibility:hidden;
}
}
</style>

</head>

<body>
<div id="splash-screen">
<img src="logo.png" alt="Logo">
</div>

<header>

<h1>Quick Revision</h1>

<p>Maths Practice Set for Competitive Exams</p>

</header>

<div class="container">

<div class="card">

<h2>Chapter Select करें</h2>

<p style="color:#555;margin-top:8px">
किसी भी chapter पर click करके practice start करें।
</p>

<!-- Arithmetic -->

<div class="section-title"
onclick="toggleBox('arithmeticBox')">

<span>▦ ARITHMETICS</span>

<span>⌄</span>

</div>

<div id="arithmeticBox"
class="topic-box"></div>

<!-- Advance -->

<div class="section-title"
onclick="toggleBox('advanceBox')">

<span>√x ADVANCE MATH</span>

<span>⌄</span>

</div>

<div id="advanceBox"
class="topic-box"></div>

<!-- Bottom -->

<div class="bottom-bar">

<div class="selected-count">

<span id="selectedCount">0</span>

Chapter(s) Selected

</div>

<button class="start-btn"
onclick="startPractice()">

✓ Start Practice

</button>

</div>

</div>

</div>

<footer>

© Quick Revision | Maths Practice Site

</footer>

<script>

/* Arithmetic Topics */

const arithmeticTopics=[

"TEST YOUR CALCULATION",
"PERCENTAGE",
"PROFIT AND LOSS",
"DISCOUNT",
"PARTNERSHIP",
"RATIO AND PROPORTION",
"MIXTURE",
"ALLIGATION",
"SIMPLE INTEREST",
"COMPOUND INTEREST",
"AVERAGE",
"TIME AND WORK",
"PIPE AND CISTERN",
"TIME AND DISTANCE",
"TRAIN",
"BOAT AND STREAM",
"LINEAR AND CIRCULAR RACE",
"PERMUTATION AND COMBINATION",
"PROBABILITY",
"STATICS",
"LOGARITHM"

];

/* Advance Topics */

const advanceTopics=[

"NUMBER SYSTEM",
"LCM AND HCF",
"SEQUENCE AND SERIES",
"SIMPLIFICATION",
"SQUARE AND INDICES",
"GEOMETRY",
"MENSURATION 2D",
"MENSURATION 3D",
"ALGEBRA",
"TRIGONOMETRY",
"HEIGHT AND DISTANCE",
"CO-ORDINATE GEOMETRY"

];

/* Create Topics */

function makeTopics(list,boxId){

const box=document.getElementById(boxId);

box.innerHTML="";

list.forEach((topic,index)=>{

const div=document.createElement("div");

div.className="topic";

div.innerHTML=`

<div class="left">

<input type="checkbox"
class="check"
onchange="updateCount()">

<span>${index+1}. ${topic}</span>

</div>

<div class="badges">

<span class="badge-blue">
5 sets
</span>

<span class="badge-green">
50 Questions
</span>

</div>

`;

box.appendChild(div);

});

}

makeTopics(arithmeticTopics,"arithmeticBox");

makeTopics(advanceTopics,"advanceBox");

/* Toggle */

function toggleBox(id){

document.getElementById(id).classList.toggle("hidden");

}

/* Count */

function updateCount(){

document.getElementById("selectedCount").innerText=
document.querySelectorAll(".check:checked").length;

}

/* Start */

function startPractice(){

let total=document.querySelectorAll(".check:checked").length;

if(total===0){

alert("पहले कोई topic select करें");

}else{

alert(total+" chapter selected. Practice जल्द start होगा.");

}

}

</script>

</body>

</html>

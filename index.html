
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quick Revision</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#eef3fb;
}

.hidden{
display:none!important;
}

#authPage{
position:fixed;
top:0;
left:0;
width:100%;
height:100vh;
background:#eef3fb;
display:flex;
justify-content:center;
align-items:center;
padding:15px;
z-index:99999;
}

.auth-card{
width:100%;
max-width:430px;
background:white;
padding:22px;
border-radius:24px;
box-shadow:0 10px 30px rgba(0,0,0,.15);
}

.auth-title{
text-align:center;
margin-bottom:18px;
}

.auth-title h1{
font-size:54px;
color:#0b57d0;
margin-bottom:8px;
}

.auth-title p{
font-size:14px;
font-weight:bold;
color:#0b57d0;
line-height:1.7;
}

.auth-tabs,
.method-tabs{
display:grid;
grid-template-columns:1fr 1fr;
gap:10px;
margin-bottom:18px;
}

.auth-tabs button,
.method-tabs button{
padding:14px;
border:none;
border-radius:14px;
font-weight:bold;
font-size:18px;
cursor:pointer;
background:#dfe6f7;
color:#0b57d0;
}

.auth-tabs button.active,
.method-tabs button.active{
background:#0b57d0;
color:white;
}

input{
width:100%;
padding:15px;
border:1px solid #cfd8ea;
border-radius:14px;
margin-bottom:12px;
font-size:16px;
}

.phone-row{
display:flex;
gap:10px;
}

.code{
width:70px;
background:#f3f6fd;
display:flex;
align-items:center;
justify-content:center;
border-radius:14px;
font-weight:bold;
border:1px solid #cfd8ea;
margin-bottom:12px;
}

.main-btn{
width:100%;
padding:15px;
border:none;
border-radius:14px;
font-size:20px;
font-weight:bold;
background:#0b57d0;
color:white;
cursor:pointer;
margin-bottom:12px;
}

.green-btn{
background:#16a34a;
}

#authMsg{
text-align:center;
font-weight:bold;
color:#0b57d0;
min-height:25px;
}

#mainContent{
display:none;
}

header{
background:#0b57d0;
color:white;
padding:18px;
text-align:center;
position:sticky;
top:0;
z-index:100;
}

header h1{
font-size:42px;
}

.container{
max-width:1200px;
margin:auto;
padding:18px;
}

.card{
background:white;
padding:20px;
border-radius:20px;
margin-bottom:20px;
box-shadow:0 4px 12px rgba(0,0,0,.08);
}

.grid2{
display:grid;
grid-template-columns:1fr 1fr;
gap:18px;
}

.big-btn{
padding:35px;
font-size:32px;
font-weight:bold;
background:white;
border:2px solid #0b57d0;
color:#0b57d0;
border-radius:22px;
cursor:pointer;
}

.topic{
padding:18px;
border:2px solid #cfd8ea;
border-radius:16px;
margin-bottom:12px;
font-weight:bold;
font-size:18px;
cursor:pointer;
display:flex;
justify-content:space-between;
align-items:center;
}

.badge{
background:#eef3ff;
padding:6px 10px;
border-radius:10px;
font-size:12px;
color:#0b57d0;
}

.question{
font-size:28px;
font-weight:bold;
margin:20px 0;
}

.option{
width:100%;
padding:16px;
margin-bottom:12px;
text-align:left;
font-size:18px;
border:2px solid #dbe3f5;
background:white;
border-radius:14px;
cursor:pointer;
}

.result-buttons{
display:flex;
justify-content:center;
flex-wrap:wrap;
gap:14px;
margin-top:18px;
}

footer{
text-align:center;
padding:25px;
font-weight:bold;
line-height:1.8;
}

@media(max-width:768px){
.grid2{
grid-template-columns:1fr;
}

.big-btn{
font-size:24px;
padding:28px;
}

header h1{
font-size:32px;
}
}
</style>
</head>
<body>

<div id="authPage">
<div class="auth-card">

<div class="auth-title">
<h1>Quick Revision</h1>
<p>
Railway | Bihar SI | Bihar Police | Bihar Teacher | SSC |
Banking | BPSC | Other Competitive Exams
</p>
</div>

<div class="auth-tabs">
<button id="loginTab" class="active" onclick="showLogin()">LOGIN</button>
<button id="signupTab" onclick="showSignup()">NEW USER</button>
</div>

<div id="loginBox">
<div class="method-tabs">
<button id="loginEmailBtn" class="active" onclick="loginEmailMode()">Email Login</button>
<button id="loginPhoneBtn" onclick="loginPhoneMode()">Mobile OTP</button>
</div>

<div id="loginEmailArea">
<input type="email" id="loginEmail" placeholder="Enter Email">
<input type="password" id="loginPassword" placeholder="Enter Password">
<button class="main-btn" onclick="loginEmailPassword()">Login</button>
</div>

<div id="loginPhoneArea" class="hidden">
<div class="phone-row">
<div class="code">+91</div>
<input type="text" id="loginPhone" placeholder="Enter Mobile Number">
</div>
<button class="main-btn" onclick="sendLoginOTP()">Send OTP</button>
<input type="text" id="loginOtp" placeholder="Enter OTP">
<button class="main-btn green-btn" onclick="verifyLoginOTP()">Verify & Login</button>
</div>
</div>

<div id="signupBox" class="hidden">
<div class="method-tabs">
<button id="signupEmailBtn" class="active" onclick="signupEmailMode()">Email Signup</button>
<button id="signupPhoneBtn" onclick="signupPhoneMode()">Mobile OTP</button>
</div>

<div id="signupEmailArea">
<input type="text" id="signupName" placeholder="Full Name">
<input type="email" id="signupEmail" placeholder="Enter Email">
<input type="password" id="signupPassword" placeholder="Create Password">
<button class="main-btn green-btn" onclick="signupEmailPassword()">Create Account</button>
</div>

<div id="signupPhoneArea" class="hidden">
<input type="text" id="signupPhoneName" placeholder="Full Name">
<div class="phone-row">
<div class="code">+91</div>
<input type="text" id="signupPhone" placeholder="Enter Mobile Number">
</div>
<button class="main-btn" onclick="sendSignupOTP()">Send OTP</button>
<input type="text" id="signupOtp" placeholder="Enter OTP">
<button class="main-btn green-btn" onclick="verifySignupOTP()">Verify & Continue</button>
</div>
</div>

<div id="recaptcha-container"></div>
<div id="authMsg"></div>

</div>
</div>

<div id="mainContent">
<header>
<h1>Quick Revision</h1>
<p>Maths Practice Set for Competitive Exams</p>
</header>

<div class="container">
<div class="card" id="testSelect">
<h2 style="margin-bottom:15px;">Test Select करें</h2>
<div class="grid2">
<button class="big-btn">MIX TEST</button>
<button class="big-btn">CHAPTER TEST</button>
</div>
</div>
</div>

<footer>
© Quick Revision | Maths Practice Site<br>
Founder: Vicky Kumar<br>
Mobile No: 6200848211
</footer>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>

<script>
const firebaseConfig={
apiKey:"AIzaSyDX45cM3C-iZSIDua_GGqb8nL1pVibzlWE",
authDomain:"quick-revision-854ab.firebaseapp.com",
projectId:"quick-revision-854ab",
storageBucket:"quick-revision-854ab.firebasestorage.app",
messagingSenderId:"200424391350",
appId:"1:200424391350:web:251d8eb2148f4b8960dc17"
};

firebase.initializeApp(firebaseConfig);
const auth=firebase.auth();

function msg(t){
document.getElementById("authMsg").innerText=t;
}

function openMain(){
document.getElementById("authPage").style.display="none";
document.getElementById("mainContent").style.display="block";
}

function showLogin(){
loginBox.classList.remove("hidden");
signupBox.classList.add("hidden");
loginTab.classList.add("active");
signupTab.classList.remove("active");
}

function showSignup(){
signupBox.classList.remove("hidden");
loginBox.classList.add("hidden");
signupTab.classList.add("active");
loginTab.classList.remove("active");
}

function loginEmailMode(){
loginEmailArea.classList.remove("hidden");
loginPhoneArea.classList.add("hidden");
loginEmailBtn.classList.add("active");
loginPhoneBtn.classList.remove("active");
}

function loginPhoneMode(){
loginPhoneArea.classList.remove("hidden");
loginEmailArea.classList.add("hidden");
loginPhoneBtn.classList.add("active");
loginEmailBtn.classList.remove("active");
}

function signupEmailMode(){
signupEmailArea.classList.remove("hidden");
signupPhoneArea.classList.add("hidden");
signupEmailBtn.classList.add("active");
signupPhoneBtn.classList.remove("active");
}

function signupPhoneMode(){
signupPhoneArea.classList.remove("hidden");
signupEmailArea.classList.add("hidden");
signupPhoneBtn.classList.add("active");
signupEmailBtn.classList.remove("active");
}

function loginEmailPassword(){
const email=loginEmail.value.trim();
const pass=loginPassword.value.trim();

auth.signInWithEmailAndPassword(email,pass)
.then(()=>{
msg("Login Successful ✅");
openMain();
})
.catch(e=>msg(e.message));
}

function signupEmailPassword(){
const email=signupEmail.value.trim();
const pass=signupPassword.value.trim();

auth.createUserWithEmailAndPassword(email,pass)
.then(()=>{
msg("Account Created ✅");
openMain();
})
.catch(e=>msg(e.message));
}

function setupCaptcha(){
if(!window.recaptchaVerifier){
window.recaptchaVerifier=new firebase.auth.RecaptchaVerifier("recaptcha-container",{
size:"invisible"
});
}
}

function phoneValue(id){
let p=document.getElementById(id).value.replace(/\D/g,"");
if(p.length!==10){
msg("10 digit number डालें");
return null;
}
return "+91"+p;
}

function sendLoginOTP(){
const phone=phoneValue("loginPhone");
if(!phone)return;
setupCaptcha();

auth.signInWithPhoneNumber(phone,window.recaptchaVerifier)
.then(r=>{
window.loginConfirm=r;
msg("OTP Sent ✅");
})
.catch(e=>msg(e.message));
}

function verifyLoginOTP(){
const otp=loginOtp.value.trim();
window.loginConfirm.confirm(otp)
.then(()=>{
msg("Login Successful ✅");
openMain();
})
.catch(e=>msg(e.message));
}

function sendSignupOTP(){
const phone=phoneValue("signupPhone");
if(!phone)return;
setupCaptcha();

auth.signInWithPhoneNumber(phone,window.recaptchaVerifier)
.then(r=>{
window.signupConfirm=r;
msg("OTP Sent ✅");
})
.catch(e=>msg(e.message));
}

function verifySignupOTP(){
const otp=signupOtp.value.trim();
window.signupConfirm.confirm(otp)
.then(()=>{
msg("Signup Successful ✅");
openMain();
})
.catch(e=>msg(e.message));
}
</script>

</body>
</html>
